<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルート日報 | ルート報告ツール</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="brand-logo">ルート日報</div>
            <div class="brand-subtitle">Route Report Management</div>
        </header>

        <main class="card">
            <form id="reportForm">
                <div class="form-group">
                    <label><i class="bi bi-calendar2-check"></i> 訪問曜日を選択</label>
                    <div class="day-grid">
                        <button type="button" class="day-btn" data-day="Tuesday">火曜日</button>
                        <button type="button" class="day-btn" data-day="Wednesday">水曜日</button>
                        <button type="button" class="day-btn" data-day="Thursday">木曜日</button>
                        <button type="button" class="day-btn" data-day="Friday">金曜日</button>
                    </div>
                </div>

                <div class="form-group" id="customer-container" style="display: none;">
                    <label for="storeName"><i class="bi bi-shop"></i> 得意先を選択</label>
                    <select id="storeName" required>
                        <option value="">サロンを選択してください</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reportText"><i class="bi bi-chat-left-text"></i> 報告内容</label>
                    <textarea id="reportText" placeholder="活動内容・コメントを入力..." required></textarea>
                </div>

                <div class="camera-section">
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
                    <div class="camera-btn">
                        <i class="bi bi-camera-fill"></i>
                    </div>
                    <p style="font-size: 12px; color: var(--accent-blue); margin-top: 8px; font-weight: 500;">現場を撮影する
                    </p>
                    <div id="previewContainer" class="preview-container"></div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <span class="btn-text">報告を送信する</span>
                    <i class="bi bi-send btn-text"></i>
                </button>
            </form>
        </main>
    </div>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p style="color: var(--primary-bg); font-weight: 700;">送信中...</p>
    </div>

    <footer>
        &copy; 2026 2ND BRAIN SYSTEMS
    </footer>

    <!-- Scripts -->
    <script src="js/Config.js"></script>
    <script src="js/App.js"></script>
</body>

</html>
