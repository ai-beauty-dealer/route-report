<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URUGAMI SYSTEM | ルート日報入力</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-gold: #cfa840;
            --accent-blue: #38bdf8;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --shadow-glow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--accent-gold);
            letter-spacing: 0.15em;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 32px 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .day-grid {
            display: grid;
            grid-template-cols: repeat(2, 1fr);
            gap: 10px;
        }

        .day-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .day-btn.active {
            background: var(--accent-blue);
            color: var(--primary-bg);
            border-color: var(--accent-blue);
            font-weight: 700;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        select,
        textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-light);
            padding: 14px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus,
        textarea:focus {
            border-color: var(--accent-blue);
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-submit:active:not(:disabled) {
            transform: scale(0.97);
        }

        #status-msg {
            margin-top: 16px;
            text-align: center;
            font-size: 0.85rem;
            min-height: 1.2rem;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        footer {
            margin-top: auto;
            padding: 32px 0;
            color: var(--text-muted);
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        /* Animation for customer select */
        #customer-container {
            display: none;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .visible {
            display: block !important;
            animation: slideDown 0.4s ease-out forwards;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading .spinner {
            display: block;
        }

        .loading .btn-text {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div class="brand-logo">URUGAMI SYSTEM</div>
            <div class="brand-subtitle">Route Report Management</div>
        </header>

        <div class="card">
            <div class="form-group">
                <label><i class="bi bi-calendar2-check"></i> 訪問曜日を選択</label>
                <div class="day-grid">
                    <button class="day-btn" onclick="selectDay('Tuesday', this)">火曜日</button>
                    <button class="day-btn" onclick="selectDay('Wednesday', this)">水曜日</button>
                    <button class="day-btn" onclick="selectDay('Thursday', this)">木曜日</button>
                    <button class="day-btn" onclick="selectDay('Friday', this)">金曜日</button>
                </div>
            </div>

            <div class="form-group" id="customer-container">
                <label><i class="bi bi-shop"></i> 得意先を選択</label>
                <select id="customer-select">
                    <option value="">サロンを選択してください</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="bi bi-chat-left-text"></i> 活動内容・コメント</label>
                <textarea id="comment" placeholder="訪問した内容、次回のアクションなど..."></textarea>
            </div>

            <button id="submit-btn" class="btn-submit" onclick="submitReport()" disabled>
                <div class="spinner"></div>
                <span class="btn-text">日報を送信する</span>
                <i class="bi bi-send btn-text"></i>
            </button>

            <div id="status-msg"></div>
        </div>
    </div>

    <footer>
        &copy; 2026 2ND BRAIN SYSTEMS
    </footer>

    <script>
        // --- Configuration ---
        const CUSTOMERS = {
            "Tuesday": ["FATE", "スコップ", "シーサイド", "サンロード", "ルテラ", "セナ", "クプラ", "KOZY", "Pブランズ長住", "カド"],
            "Wednesday": ["リッシュヘアー", "ピーブランズヘア大野城", "ピーブランズヘア春日", "アリー", "スタイリー", "ベルリアージュ", "クレア", "リズム", "ひとみ美容室", "プラント", "出張理美容", "アトリコ", "7ベルベット", "コージーベルベット", "AVE", "THREE", "ere", "Drop by drop", "ベルベット", "リコラ", "クプラ"],
            "Thursday": ["リブロ", "HALS hair place", "luck", "KOZY", "クプラ", "NATTY", "Pブランズ姪浜", "Hui", "ルテラ", "トルソー", "nook", "シーサイド"],
            "Friday": ["Lilly", "ホロホロヘアー", "Salon COCO", "Amber.", "Luxe", "クラーク", "ミツアミ堂", "LACO hair", "ベルベット千早", "プレアー", "ストロベリー"]
        };

        // 重要: ユーザーが取得したGASのURLをここに設定する
        // GitHub Pagesの場合、環境変数は使えないため直接記述するか、
        // 外部のJSON等から読み込む形式になります。
        let GAS_URL = "";

        // 初回起動時にローカルストレージからURLを読み込む（設定用）
        const savedUrl = localStorage.getItem('GAS_WEBHOOK_URL');
        if (savedUrl) GAS_URL = savedUrl;

        let currentDay = '';

        function selectDay(day, btn) {
            currentDay = day;

            // UI Update
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Populate Customer Select
            const select = document.getElementById('customer-select');
            select.innerHTML = '<option value="">サロンを選択してください</option>';
            CUSTOMERS[day].forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                select.appendChild(opt);
            });

            document.getElementById('customer-container').classList.add('visible');
            validate();
        }

        function validate() {
            const customer = document.getElementById('customer-select').value;
            const comment = document.getElementById('comment').value.trim();
            document.getElementById('submit-btn').disabled = !(currentDay && customer && comment);
        }

        document.getElementById('customer-select').addEventListener('change', validate);
        document.getElementById('comment').addEventListener('input', validate);

        async function submitReport() {
            const customer = document.getElementById('customer-select').value;
            const comment = document.getElementById('comment').value.trim();
            const btn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-msg');

            if (!GAS_URL) {
                const url = prompt("GASのWebhook URLが設定されていません。URLを入力してください:");
                if (url) {
                    GAS_URL = url;
                    localStorage.setItem('GAS_WEBHOOK_URL', url);
                } else {
                    return;
                }
            }

            btn.classList.add('loading');
            btn.disabled = true;
            statusMsg.textContent = "送信中...";
            statusMsg.className = "";

            const payload = {
                day: currentDay,
                customer: customer,
                comment: comment,
                date: new Date().toLocaleDateString('ja-JP')
            };

            try {
                // GASへの送信 (no-corsモードだとレスポンスが不透明になるため、GAS側で適切にCORS処理が必要)
                // 今回はシンプルに fetch を実行
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors', // GAS Web App の仕様上、no-cors が安定することが多い
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // no-cors の場合 response.ok は常に false だが、送信自体は成功していることが多い
                statusMsg.textContent = "送信処理を受け付けました（スプレッドシートをご確認ください）";
                statusMsg.className = "success";
                document.getElementById('comment').value = "";
                validate();
            } catch (error) {
                statusMsg.textContent = "エラーが発生しました: " + error.message;
                statusMsg.className = "error";
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
